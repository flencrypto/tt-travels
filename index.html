<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TTs Travels – Curated Journeys · Effortlessly Beautiful</title>

    <!-- SEO / description -->
    <meta name="description" content="Plan and organise your travels with AI-powered recommendations, flight search, and itinerary planning." />
    <meta name="keywords" content="travel, itinerary, flights, hotels, AI planner, trip organiser" />

    <!-- Theme colours: Chrome Rose Gold for browser UI in light mode -->
    <meta name="theme-color" content="#B76C7A" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2a1a32" media="(prefers-color-scheme: dark)" />

    <!-- Apple PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TTs Travels" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16x16.png" />

    <!-- Prevent iOS from auto-detecting phone numbers -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TTs Travels – Curated Journeys · Effortlessly Beautiful" />
    <meta property="og:description" content="Plan and organise your travels with AI-powered recommendations." />
    <meta property="og:image" content="%BASE_URL%logo-wordmark.png" />

    <!-- Fonts: Space Grotesk (headings), Inter (body), Playfair Display (accents) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,600&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="/src/main.css" rel="stylesheet" />
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
